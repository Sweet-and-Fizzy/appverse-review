name: Tests

# Runs every test-*.sh suite plus the corpus regression (run-corpus.sh) so a
# change to a checker, a fixture, or the corpus itself is caught before
# merge, not only by hand against the walkthrough docs.
on:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: pip install pyyaml

      # The suites assert shellcheck codes and semgrep/bandit output shapes, so
      # every tool is pinned and a failed install fails the job: a missing
      # tool would otherwise turn its tests into SKIPs and pass. shellcheck
      # is the 0.11.0 release binary (the version the suites were written
      # against; Ubuntu's apt package is older), checked against the release
      # asset's published sha256.
      - name: Install static analysis tools
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          tarball="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${tarball}"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          pip install --quiet semgrep==1.178.0 bandit==1.9.4

      - name: Tool versions
        run: |
          set -eu
          bash --version | head -1
          python3 --version
          shellcheck --version | sed -n 2p
          semgrep --version
          bandit --version | head -1
          python3 -c 'import yaml; print("PyYAML", yaml.__version__)'

      - name: Run test suites
        run: |
          status=0
          for t in tests/test-*.sh; do
            echo "::group::$t"
            if ! bash "$t"; then
              echo "::error::$t failed"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

      - name: Run corpus regression
        run: bash tests/run-corpus.sh
