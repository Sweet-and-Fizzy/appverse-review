# Appverse Schema Reference (cached offline fallback)
#
# TODO: Replace this placeholder with the annotated appverse.yml from
# ood-appverse/docs/appverse.yml once that file is created. At runtime,
# the skill fetches the live version from GitHub and falls back to this
# copy when offline.
#
# Known app_type values (from design docs):
#   - batch-connect-basic
#   - batch-connect-vnc
#   - companion_app
#   - widgets
#   - dashboards
#
# Required fields for declared repos:
#   - description
#   - software
#   - app_type
#   - maintainer.name
#   - maintainer.support_url

# Root-level fields
description: "Short description of the repo or single app"
software: "Name of the software this app launches (must match a catalog entry)"
app_type: "One of: batch-connect-basic, batch-connect-vnc, companion_app, widgets, dashboards"

maintainer:
  name: "Maintainer or team name"
  support_url: "URL for support (GitHub issues page, email, etc.)"

# Monorepo fields
shared_paths:
  - "shared/"

apps:
  - path: "apps/my-app"
    name: "My App"
    description: "Per-app description (overrides root)"
    software: "Per-app software (overrides root)"
    app_type: "Per-app type (overrides root)"
