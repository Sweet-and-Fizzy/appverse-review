# Appverse review checks manifest.
#
# One entry per check the per-app report must carry a row for. The report
# marks a row with `check: <id>` in its Check column; references/check-rows.py
# verifies one row per applicable check per app, and that every candidate the
# pre-review facts list is answered (R1). tests/test-docs-spine.sh verifies
# every `check: <id>` in review-rubric.md is an id here, and every
# code_quality id appears in the rubric's Code Quality section.
#
# This file is for humans. Scripts read checks.json, generated from it:
#     python3 references/checks-sync.py            # write checks.json
#     python3 references/checks-sync.py --verify   # exit 1 when out of sync
#
# Fields:
#   id           the `check: <id>` label
#   section      the rubric H2/H3 the check lives under
#   app_types    batch_connect, passenger, companion, widget
#   fact_source  the pre-review fact file(s) listing candidates, or none
#   rule         the rule code findings for this check use
#   tag          the mechanism tag (finding-codes.md vocabulary for the rule)
#                findings for this check use in their defect_key, or null
#                where the rule has no single natural tag (ratings, and STR
#                rows whose tags carry a qualifier)
#   row_required always: a row for every applicable app; when_candidates:
#                a row only when the facts list a candidate (Security is
#                row-per-candidate)
#   dimension    structure, security, portability, documentation, code_quality
#   default_severity
#                the severity a FAIL or WARN record for this check takes
#                unless the evidence clearly warrants another, in which case
#                the record's summary says why: critical, high, medium, low,
#                info, or null where severity is judged per finding
#                (Security, on the rubric's severity scale). Gate checks
#                default to high for a FAIL; a structure WARN is not a gate
#                failure and is rated on the rubric's scale (see
#                review-structure). Suggestion checks default to info, and for
#                them info is a ceiling: check-rating.py flags a suggestion
#                record above info, so a suggestion is never a fix-item
#                (Low or above, check-feedback-floor.py) and never keeps
#                the recommendation from Accept
#   tags         suggestion checks only: every finding-codes.md vocabulary
#                tag (without its qualifier) the check owns under its rule,
#                so check-rating.py treats a FAIL, or a FAIL or WARN above
#                info, on any of them as a suggestion recorded wrongly,
#                whichever tag was chosen
#   weight       code_quality checks only: target (a strong suggestion,
#                worded as recommended) or suggestion (never a failure) — from the
#                rubric's Code Quality table
#
# Passenger apps: str-06-syntax and the Batch Connect facts (form.json,
# template.json) do not apply; entry-point-parses applies instead.

checks:
  # Structure
  - id: str-02-metadata
    section: Repository structure
    app_types: [batch_connect, passenger, companion, widget]
    fact_source: none
    rule: STR-02
    tag: null
    row_required: always
    dimension: structure
    default_severity: high
  - id: str-03-yaml-valid
    section: Validity
    app_types: [batch_connect, passenger, companion, widget]
    fact_source: none
    rule: STR-03
    tag: yaml-parse-error
    row_required: always
    dimension: structure
    default_severity: high
  - id: str-06-syntax
    section: Validity
    app_types: [batch_connect]
    fact_source: syntax.json
    rule: STR-06
    tag: bash-syntax-error
    row_required: always
    dimension: structure
    default_severity: high
  - id: str-07-layout
    section: Batch Connect layout
    app_types: [batch_connect]
    fact_source: none
    rule: STR-07
    tag: layout-mismatch
    row_required: always
    dimension: structure
    default_severity: high
  - id: entry-point-parses
    section: Batch Connect layout
    app_types: [passenger, companion]
    fact_source: entry_point.json
    rule: STR-07
    tag: null
    row_required: always
    dimension: structure
    default_severity: high
  - id: str-04-references
    section: Validity
    app_types: [batch_connect, passenger, companion, widget]
    fact_source: none
    rule: STR-04
    tag: null
    row_required: always
    dimension: structure
    default_severity: high

  # Security: row-per-candidate, so a row is required only when
  # security.json lists a candidate of the check's kind.
  - id: sec-interpolation
    section: Pattern checks (all app types)
    app_types: [batch_connect, passenger, companion, widget]
    fact_source: security.json
    rule: OODT-01
    tag: unsanitized-user-input
    row_required: when_candidates
    dimension: security
    default_severity: null
  - id: sec-eval-exec
    section: Pattern checks (all app types)
    app_types: [batch_connect, passenger, companion, widget]
    fact_source: security.json
    rule: OODT-01
    tag: eval-exec
    row_required: when_candidates
    dimension: security
    default_severity: null
  - id: sec-credential-string
    section: Pattern checks (all app types)
    app_types: [batch_connect, passenger, companion, widget]
    fact_source: security.json
    rule: OODT-02
    tag: hardcoded-credential
    row_required: when_candidates
    dimension: security
    default_severity: null
  - id: sec-permissive-mode
    section: Pattern checks (all app types)
    app_types: [batch_connect, passenger, companion, widget]
    fact_source: security.json
    rule: OODT-03
    tag: permissive-file-mode
    row_required: when_candidates
    dimension: security
    default_severity: null
  # A network call is OODT-04 (exfiltration); record OODT-05 instead when the
  # call exposes a service to other users.
  - id: sec-network-call
    section: Pattern checks (all app types)
    app_types: [batch_connect, passenger, companion, widget]
    fact_source: security.json
    rule: OODT-04
    tag: unexpected-network-call
    row_required: when_candidates
    dimension: security
    default_severity: null
  - id: sec-file-write-outside-job
    section: Pattern checks (all app types)
    app_types: [batch_connect, passenger, companion, widget]
    fact_source: security.json
    rule: OODT-07
    tag: dotfile-write
    row_required: when_candidates
    dimension: security
    default_severity: null
  # --no-auth, --disable-ssl, 0.0.0.0, CORS wildcard. A 0.0.0.0 bind is a fact
  # to judge, not a finding by itself: OOD's node proxy needs a non-loopback
  # bind, so the bind-all-interfaces candidate is FAIL or WARN only when the
  # service answers without authentication. The tag is disabled-ssl
  # because it is the OODT-08 vocabulary term; disabled-auth, bind-all-interfaces
  # and cors-wildcard are OODT-05 terms, so a finding recording one of those
  # uses OODT-05 as its rule.
  - id: sec-config-flag
    section: Pattern checks (all app types)
    app_types: [batch_connect, passenger, companion, widget]
    fact_source: security.json
    rule: OODT-08
    tag: disabled-ssl
    row_required: when_candidates
    dimension: security
    default_severity: null
  - id: sec-binary-in-template
    section: Pattern checks (all app types)
    app_types: [batch_connect, passenger, companion, widget]
    fact_source: security.json
    rule: OODT-04
    tag: binary-in-template
    row_required: when_candidates
    dimension: security
    default_severity: null
  # Every static-tool finding (shellcheck, semgrep, bandit) is its own
  # candidate; rule and tag are null on the manifest entry because the
  # record, when FAIL/WARN, uses the rule and tag the code maps to in
  # security-tools.md (a QUA-xx record is possible too), set per match.
  - id: sec-tool-finding
    section: Tier 2 — Tooling
    app_types: [batch_connect, passenger, companion, widget]
    fact_source: security.json
    rule: null
    tag: null
    row_required: when_candidates
    dimension: security
    default_severity: null

  # Portability
  - id: hardcoded-site-paths
    section: Portability
    app_types: [batch_connect]
    fact_source: template.json
    rule: QUA-02
    tag: hardcoded-path
    row_required: always
    dimension: portability
    default_severity: low
  - id: portability-rating
    section: Portability
    app_types: [batch_connect, passenger, companion, widget]
    fact_source: none
    rule: QUA-02
    tag: null
    row_required: always
    dimension: portability
    default_severity: medium

  # Documentation
  - id: documentation-rating
    section: Documentation
    app_types: [batch_connect, passenger, companion, widget]
    fact_source: readme.json
    rule: QUA-01
    tag: null
    row_required: always
    dimension: documentation
    default_severity: medium

  # Code Quality
  # Error handling: job scripts check the commands whose failure matters
  # (cd, module load, mkdir, a copy the job depends on) with `|| exit`, an
  # `if`, a trap, or `set -e` where the author chose it. `set -e` is not
  # required (it can break a script with background processes, such as a
  # VNC script.sh); a missing `set -e` alone is not a finding. A script with
  # no handling on such commands is.
  - id: error-handling
    section: Code Quality
    app_types: [batch_connect, passenger, companion, widget]
    fact_source: none
    rule: QUA-03
    tag: no-error-check
    row_required: always
    dimension: code_quality
    default_severity: low
    weight: target
  # Input validation: a numeric field that reaches the scheduler has a `min`
  # (or is `required`), so a blank or 0 value cannot reach the job. A `max`
  # is good but is site policy (node size, partition limits): it may come
  # from site config (an attribute the site sets, or ERB), and a hardcoded
  # `max` is not required, so a missing `max` alone is not a finding. A
  # `min` of 0 where 0 is meaningless (0 cores, 0 hours) is QUA-07
  # zero-minimum.
  - id: numeric-field-bounds
    section: Code Quality
    app_types: [batch_connect]
    fact_source: form.json
    rule: QUA-07
    tag: missing-min
    row_required: always
    dimension: code_quality
    default_severity: low
    weight: target
  - id: magic-numbers
    section: Code Quality
    app_types: [batch_connect]
    fact_source: template.json
    rule: QUA-08
    tag: magic-number
    tags: [magic-number, undocumented-resource-limit, undocumented-hex-color]
    row_required: always
    dimension: code_quality
    default_severity: info
    weight: suggestion
  - id: duplicated-blocks
    section: Code Quality
    app_types: [batch_connect, passenger, companion, widget]
    fact_source: none
    rule: QUA-09
    tag: duplicated-block
    tags: [duplicated-block]
    row_required: always
    dimension: code_quality
    default_severity: info
    weight: suggestion
  - id: dead-code
    section: Code Quality
    app_types: [batch_connect]
    fact_source: template.json
    rule: QUA-04
    tag: commented-out-code
    tags: [unused-attribute, dead-branch, commented-out-code, unreachable-lookup-entry]
    row_required: always
    dimension: code_quality
    default_severity: info
    weight: suggestion
  - id: erb-missing-value
    section: Code Quality
    app_types: [batch_connect]
    fact_source: form.json
    rule: QUA-10
    tag: erb-missing-value-unhandled
    tags: [erb-missing-value-unhandled]
    row_required: always
    dimension: code_quality
    default_severity: info
    weight: suggestion
  - id: icon-matches-target-os
    section: Code Quality
    app_types: [batch_connect]
    fact_source: [template.json, readme.json]
    rule: QUA-06
    tag: icon-os-mismatch
    tags: [icon-os-mismatch]
    row_required: always
    dimension: code_quality
    default_severity: info
    weight: suggestion
